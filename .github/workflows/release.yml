name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          if [[ ! "$TAG" =~ ^v${semver}$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest

      - name: Build standalone asset
        run: python scripts/build.py

      - name: Smoke-test standalone asset
        run: |
          smoke_dir="$RUNNER_TEMP/hostof-smoke"
          mkdir -p "$smoke_dir"
          cp dist/hostof "$smoke_dir/hostof"
          (cd "$smoke_dir" && ./hostof --help)
          (cd dist && sha256sum --check hostof.sha256)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/hostof \
            dist/hostof.sha256 \
            --verify-tag \
            --title "hostof $TAG" \
            --generate-notes
